services:
  - type: web
    name: coffee-shop-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-shop-db
          property: connectionString

  - type: web
    name: coffee-shop-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://coffee-shop-api.onrender.com/api

  - type: postgres
    name: coffee-shop-db
    plan: free
    ipAllowList: []
    postgresMajorVersion: 15